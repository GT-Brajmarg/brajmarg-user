<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#fff5d8"/>
      <stop offset="0.6" stop-color="#f4b942"/>
      <stop offset="1" stop-color="#c47020"/>
    </radialGradient>
    <radialGradient id="thali" cx="0.4" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#ffe089"/>
      <stop offset="0.5" stop-color="#d4941a"/>
      <stop offset="1" stop-color="#7a5208"/>
    </radialGradient>
    <radialGradient id="laddu" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#ffd97a"/>
      <stop offset="0.7" stop-color="#c47a20"/>
      <stop offset="1" stop-color="#5a3008"/>
    </radialGradient>
    <linearGradient id="diya" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe089"/>
      <stop offset="1" stop-color="#7a5208"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Decorative rangoli border -->
  <g fill="#7a0a0a" opacity="0.15">
    <circle cx="100" cy="100" r="20"/>
    <circle cx="700" cy="100" r="20"/>
    <circle cx="100" cy="500" r="20"/>
    <circle cx="700" cy="500" r="20"/>
  </g>

  <!-- Lotus petals scattered around -->
  <g fill="#fff5d8" opacity="0.3">
    <ellipse cx="400" cy="80"  rx="40" ry="80"/>
    <ellipse cx="400" cy="520" rx="40" ry="80"/>
  </g>

  <!-- Brass thali -->
  <g transform="translate(400 320)">
    <ellipse cx="0" cy="20" rx="220" ry="180" fill="url(#thali)"/>
    <ellipse cx="0" cy="0"  rx="180" ry="150" fill="#a06010" opacity="0.5"/>
    <ellipse cx="0" cy="-5" rx="165" ry="135" fill="url(#thali)"/>
    <ellipse cx="-15" cy="-25" rx="125" ry="100" fill="#fff0c8" opacity="0.25"/>

    <!-- Laddoos arranged -->
    <g>
      <!-- Back-left -->
      <circle cx="-65" cy="-35" r="48" fill="url(#laddu)"/>
      <circle cx="-78" cy="-52" r="14" fill="#ffe89c" opacity="0.5"/>
      <circle cx="-85" cy="-25" r="2.5" fill="#fff0c8"/>
      <circle cx="-50" cy="-48" r="2.5" fill="#fff0c8"/>
      <circle cx="-40" cy="-15" r="2.5" fill="#fff0c8"/>

      <!-- Back-right -->
      <circle cx="65" cy="-35" r="48" fill="url(#laddu)"/>
      <circle cx="52" cy="-52" r="14" fill="#ffe89c" opacity="0.5"/>
      <circle cx="45" cy="-25" r="2.5" fill="#fff0c8"/>
      <circle cx="80" cy="-48" r="2.5" fill="#fff0c8"/>
      <circle cx="90" cy="-15" r="2.5" fill="#fff0c8"/>

      <!-- Front -->
      <circle cx="0" cy="35" r="55" fill="url(#laddu)"/>
      <circle cx="-15" cy="18" r="16" fill="#ffe89c" opacity="0.55"/>
      <circle cx="-20" cy="45" r="3" fill="#fff0c8"/>
      <circle cx="20" cy="20"  r="3" fill="#fff0c8"/>
      <circle cx="28" cy="55"  r="3" fill="#fff0c8"/>
      <circle cx="-5" cy="65"  r="3" fill="#fff0c8"/>
    </g>

    <!-- Marigold petals scattered on thali -->
    <g fill="#ff8a1c">
      <circle cx="-130" cy="80" r="6"/>
      <circle cx="-140" cy="100" r="5"/>
      <circle cx="130"  cy="80" r="6"/>
      <circle cx="140"  cy="100" r="5"/>
    </g>
  </g>

  <!-- Diya (oil lamp) on left -->
  <g transform="translate(150 380)">
    <ellipse cx="0" cy="20" rx="50" ry="14" fill="#7a5208"/>
    <path d="M -50 20 Q -50 50 0 56 Q 50 50 50 20 Z" fill="url(#diya)"/>
    <ellipse cx="0" cy="20" rx="42" ry="10" fill="#5a3008" opacity="0.5"/>
    <!-- Wick -->
    <rect x="-2" y="6" width="4" height="14" fill="#5a3008"/>
    <!-- Flame -->
    <path d="M 0 -30 Q -12 -10 -8 8 Q 0 14 8 8 Q 12 -10 0 -30 Z" fill="#ff8a1c"/>
    <path d="M 0 -22 Q -7 -8 -4 6 Q 0 10 4 6 Q 7 -8 0 -22 Z" fill="#ffd76b"/>
    <ellipse cx="0" cy="0" r="1" fill="#fff5d8"/>
    <!-- Glow -->
    <circle cx="0" cy="-5" r="60" fill="#ffd76b" opacity="0.15"/>
  </g>

  <!-- Diya on right -->
  <g transform="translate(650 380)">
    <ellipse cx="0" cy="20" rx="50" ry="14" fill="#7a5208"/>
    <path d="M -50 20 Q -50 50 0 56 Q 50 50 50 20 Z" fill="url(#diya)"/>
    <ellipse cx="0" cy="20" rx="42" ry="10" fill="#5a3008" opacity="0.5"/>
    <rect x="-2" y="6" width="4" height="14" fill="#5a3008"/>
    <path d="M 0 -30 Q -12 -10 -8 8 Q 0 14 8 8 Q 12 -10 0 -30 Z" fill="#ff8a1c"/>
    <path d="M 0 -22 Q -7 -8 -4 6 Q 0 10 4 6 Q 7 -8 0 -22 Z" fill="#ffd76b"/>
    <ellipse cx="0" cy="0" r="1" fill="#fff5d8"/>
    <circle cx="0" cy="-5" r="60" fill="#ffd76b" opacity="0.15"/>
  </g>
</svg>

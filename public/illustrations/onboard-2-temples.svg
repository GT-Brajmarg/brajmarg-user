<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1d4a"/>
      <stop offset="0.4" stop-color="#c4521e"/>
      <stop offset="0.8" stop-color="#f4b942"/>
      <stop offset="1" stop-color="#fff5d8"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7d8"/>
      <stop offset="0.5" stop-color="#ffd76b" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffaa3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="temple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0608"/>
      <stop offset="1" stop-color="#5a1d12"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="400" cy="380" r="200" fill="url(#sun)"/>
  <circle cx="400" cy="380" r="55" fill="#fff5d8"/>
  <circle cx="400" cy="380" r="40" fill="#ffd76b" opacity="0.6"/>

  <!-- Sun rays -->
  <g stroke="#fff5d8" stroke-width="1.5" opacity="0.5">
    <line x1="400" y1="80"  x2="400" y2="180"/>
    <line x1="200" y1="200" x2="280" y2="260"/>
    <line x1="600" y1="200" x2="520" y2="260"/>
    <line x1="80"  y1="380" x2="180" y2="380"/>
    <line x1="620" y1="380" x2="720" y2="380"/>
  </g>

  <!-- Distant hill -->
  <path d="M 0 460 Q 200 410 400 440 T 800 450 L 800 600 L 0 600 Z" fill="#1a0608" opacity="0.6"/>

  <!-- 3 temples on a row -->
  <g fill="url(#temple)">
    <!-- Left small -->
    <rect x="100" y="430" width="120" height="120"/>
    <path d="M 110 430 L 110 360 L 160 290 L 210 360 L 210 430 Z"/>
    <circle cx="160" cy="285" r="6"/>
    <line x1="160" y1="278" x2="160" y2="265" stroke="#5a1d12" stroke-width="2"/>
    <rect x="148" y="490" width="24" height="60" fill="#0a0306"/>

    <!-- Center main (largest) -->
    <rect x="320" y="380" width="160" height="170"/>
    <path d="M 330 380 L 330 280 L 400 180 L 470 280 L 470 380 Z"/>
    <circle cx="400" cy="175" r="9"/>
    <line x1="400" y1="166" x2="400" y2="148" stroke="#5a1d12" stroke-width="3"/>
    <circle cx="400" cy="144" r="4"/>
    <rect x="380" y="460" width="40" height="90" fill="#0a0306"/>
    <path d="M 380 460 Q 380 440 400 440 Q 420 440 420 460" fill="#0a0306"/>

    <!-- Right small -->
    <rect x="580" y="430" width="120" height="120"/>
    <path d="M 590 430 L 590 360 L 640 290 L 690 360 L 690 430 Z"/>
    <circle cx="640" cy="285" r="6"/>
    <line x1="640" y1="278" x2="640" y2="265" stroke="#5a1d12" stroke-width="2"/>
    <rect x="628" y="490" width="24" height="60" fill="#0a0306"/>
  </g>

  <!-- Stars -->
  <g fill="#fff5d8" opacity="0.8">
    <circle cx="80"  cy="80"  r="1.5"/>
    <circle cx="150" cy="60"  r="1"/>
    <circle cx="280" cy="100" r="1.2"/>
    <circle cx="540" cy="80"  r="1"/>
    <circle cx="650" cy="60"  r="1.5"/>
    <circle cx="720" cy="120" r="1"/>
  </g>
</svg>
